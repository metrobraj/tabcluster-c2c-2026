<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tabCluster — Host Dashboard</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/host.css">
</head>
<body>
  <h1>tabCluster Host Engine</h1>
  
  <canvas id="renderCanvas" width="1000" height="1000" style="border: 1px solid #00f2fe; background: #000;"></canvas>

  <script type="module">
    import { TaskDispatcher } from './js/host/dispatcher.js';
    import { CanvasPainter } from './js/host/canvas.js';

    // Initialize core host modules
    window.dispatcher = new TaskDispatcher();
    window.painter = new CanvasPainter('renderCanvas');

    // Helper function for network layer to trigger rendering when a chunk completes
    window.handleCompletedTask = function(taskId, pixelBuffer) {
      const task = window.dispatcher.taskQueue.find(t => t.taskId === taskId);
      if (task) {
        window.dispatcher.markTaskComplete(taskId);
        window.painter.drawTile(task.startX, task.startY, task.width, task.height, pixelBuffer);
        console.log(`[Host Engine] Rendered tile ${taskId} | Progress: ${window.dispatcher.getProgress()}%`);
      }
    };

    console.log('[Host Engine] Ready to receive tasks.');
  </script>
</body>
</html>
