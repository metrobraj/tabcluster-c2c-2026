<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tabCluster — Host Dashboard</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/host.css">
</head>
<body>
  <h1>tabCluster Host Engine</h1>
  
  <!-- Canvas where the Mandelbrot fractal will be painted -->
  <canvas id="renderCanvas" width="1000" height="1000" style="border: 1px solid #00f2fe; background: #000;"></canvas>

  <!-- Load your dispatcher module script -->
  <script type="module">
    import { TaskDispatcher } from './js/host/dispatcher.js';
    
    // Attach dispatcher to the global window object so we can test it in console
    window.TaskDispatcher = TaskDispatcher;
    window.dispatcher = new TaskDispatcher();
    
    console.log("Host initialized! Dispatcher ready with tasks:", window.dispatcher.taskQueue.length);
  </script>
</body>
</html>
