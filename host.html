<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tabCluster — Host Dashboard</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/host.css">
</head>
<body>
  <h1>tabCluster Host Engine</h1>
  
  <canvas id="renderCanvas" width="1000" height="1000" style="border: 1px solid #00f2fe; background: #000;"></canvas>

  <script type="module">
    import { Dispatcher } from './js/host/dispatcher.js';
    import { CanvasPainter } from './js/host/canvas.js';

    // Global instances for debugging
    window.dispatcher = new Dispatcher();
    window.painter = new CanvasPainter('renderCanvas');

    // Start chunk generation and networking listeners
    window.dispatcher.start();

    console.log('[Host Engine] Initialized and waiting for worker connections...');
  </script>
</body>
</html>
