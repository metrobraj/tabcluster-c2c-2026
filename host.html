<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tabCluster - Host</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="host-layout">
    <div class="card">
      <div class="panel-title">Room code</div>
      <div class="room-code" id="room-code">-----</div>

      <div id="qr-code" aria-label="QR code to join this room"></div>

      <div class="job-buttons">
        <button class="action" id="btn-mandelbrot">Render Mandelbrot</button>
        <button class="action secondary" id="btn-montecarlo">Run Monte&nbsp;Carlo</button>
      </div>

      <div id="status">Starting host...</div>

      <div class="stat-row">
        <span class="label">Connection</span>
        <span class="value" id="conn-mode">-</span>
      </div>
      <div class="stat-row">
        <span class="label">Active workers</span>
        <span class="value" id="stat-workers">0</span>
      </div>
      <div class="stat-row">
        <span class="label">Chunks done</span>
        <span class="value" id="stat-progress">0 / 0</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-bar"></div></div>
      <div class="stat-row">
        <span class="label">Est. TFLOPS</span>
        <span class="value" id="stat-tflops">0.000</span>
      </div>
      <div class="stat-row hidden" id="pi-row">
        <span class="label">&pi; estimate</span>
        <span class="value" id="pi-estimate">-</span>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="render-canvas"></canvas>
    </div>
  </div>

  <!-- Third-party: WebRTC signaling client + QR renderer -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- tabCluster, in dependency order -->
  <script src="js/shared/config.js"></script>
  <script src="js/shared/protocol.js"></script>
  <script src="js/network/local-bus.js"></script>
  <script src="js/network/p2pmesh.js"></script>
  <script src="js/network/transport.js"></script>
  <script src="js/network/heartbeat.js"></script>
  <script src="js/host/canvas.js"></script>
  <script src="js/host/dispatcher.js"></script>
  <script src="js/host/hostui.js"></script>
</body>
</html>
