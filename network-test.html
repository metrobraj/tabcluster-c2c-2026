<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TabCluster — Network Layer Test</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 2rem; }
    #log { white-space: pre-wrap; background: #000; padding: 1rem; height: 300px; overflow-y: auto; border-radius: 4px; }
    button { padding: 0.5rem 1rem; margin-right: 0.5rem; margin-bottom: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h2>TabCluster — Network Layer Test</h2>
  <p>Peer ID: <strong id="peerId"></strong> — Mode: <strong id="mode"></strong></p>
  <button id="sendOffer">Send fake TASK_OFFER</button>
  <button id="sendHeartbeat">Send manual HEARTBEAT</button>
  <button id="listPeers">List known peers</button>
  <div id="log"></div>

  <script type="module">
    // This file is NOT part of the real app — it's a scratch harness to
    // prove the network layer works before host.html/worker.html exist.
    import { createTransport } from './js/network/transport.js';
    import { startHeartbeat } from './js/network/heartbeat.js';
    import { taskOffer, makeChunk, MESSAGE_TYPES } from './js/shared/protocol.js';
    import { TRANSPORT_MODE, resolveRoomId } from './js/shared/config.js';

    const peerId = crypto.randomUUID().slice(0, 8);
    document.getElementById('peerId').textContent = peerId;
    document.getElementById('mode').textContent = TRANSPORT_MODE;

    function log(text) {
      const el = document.getElementById('log');
      el.textContent += `\n${new Date().toLocaleTimeString()} — ${text}`;
      el.scrollTop = el.scrollHeight;
    }

    const transport = createTransport(peerId, 'test', { roomId: resolveRoomId() });

    transport.onMessage((fromPeerId, message) => {
      log(`Received ${message.type} from ${fromPeerId}: ${JSON.stringify(message)}`);
    });

    startHeartbeat(transport, (timedOutPeerId) => {
      log(`⚠️ Peer ${timedOutPeerId} timed out`);
    });

    document.getElementById('sendOffer').onclick = () => {
      const chunk = makeChunk({ id: 'test-chunk-1', startX: 0, startY: 0, width: 100, height: 100, maxIter: 100 });
      transport.broadcast(taskOffer(chunk));
      log(`Sent TASK_OFFER for ${chunk.id}`);
    };

    document.getElementById('sendHeartbeat').onclick = () => {
      transport.broadcast({ type: MESSAGE_TYPES.HEARTBEAT, peerId, timestamp: Date.now() });
      log('Sent manual HEARTBEAT');
    };

    document.getElementById('listPeers').onclick = () => {
      log(`Known peers: ${JSON.stringify(transport.listPeers())}`);
    };
  </script>
</body>
</html>
