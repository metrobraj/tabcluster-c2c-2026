<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tabCluster - Network Test</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-center">
    <div class="card" style="max-width:640px; width:100%;">
      <div class="panel-title">Diagnostics</div>
      <h2>Network layer test</h2>
      <p style="color:var(--text-muted); font-size:13.5px;">
        Spins up a mock host and a mock worker over the local
        BroadcastChannel bus in this single tab, and runs one task
        request/assign/result round trip plus a simulated disconnect
        and re-queue - all without needing WebRTC or a second device.
      </p>
      <button class="action" id="run-btn" style="margin-bottom:14px;">Run test</button>
      <div class="test-log" id="log">Click "Run test" to start...</div>
    </div>
  </div>

  <script src="js/shared/config.js"></script>
  <script src="js/shared/protocol.js"></script>
  <script src="js/network/local-bus.js"></script>
  <script>
    const logEl = document.getElementById('log');
    function log(line, cls) {
      const span = document.createElement('div');
      if (cls) span.className = cls;
      span.textContent = line;
      logEl.appendChild(span);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function assert(cond, message) {
      log((cond ? 'PASS  ' : 'FAIL  ') + message, cond ? 'pass' : 'fail');
      return cond;
    }

    document.getElementById('run-btn').addEventListener('click', () => {
      logEl.innerHTML = '';
      log('Starting mock host + mock worker on the local bus...');

      const host = new TCLocalBus();
      const worker = new TCLocalBus();
      let hostSawWorker = false;
      let workerId = null;
      let roundTripOk = false;

      host.init({
        role: 'host',
        onReady: (id) => log(`host ready: ${id}`),
        onPeerJoin: (peerId) => {
          hostSawWorker = true;
          workerId = peerId;
          log(`host sees peer join: ${peerId}`);
        },
        onPeerLeave: (peerId) => log(`host sees peer leave: ${peerId}`),
        onMessage: (peerId, message) => {
          if (message.type === TC_MSG.TASK_REQUEST) {
            log('host received TASK_REQUEST, assigning a fake chunk');
            host.send(peerId, tcMakeMessage(TC_MSG.TASK_ASSIGN, { id: 'test-1', jobType: 'mandelbrot' }));
          }
          if (message.type === TC_MSG.TASK_RESULT) {
            roundTripOk = message.payload && message.payload.id === 'test-1';
            log(`host received TASK_RESULT for ${message.payload && message.payload.id}`);
            finish();
          }
        }
      });

      worker.init({
        role: 'worker',
        onReady: (id) => log(`worker ready: ${id}`),
        onPeerJoin: () => {
          log('worker sees host, sending TASK_REQUEST');
          worker.sendToHost(tcMakeMessage(TC_MSG.TASK_REQUEST));
        },
        onMessage: (peerId, message) => {
          if (message.type === TC_MSG.TASK_ASSIGN) {
            log('worker received TASK_ASSIGN, sending TASK_RESULT');
            worker.sendToHost(tcMakeMessage(TC_MSG.TASK_RESULT, { id: message.payload.id, jobType: 'mandelbrot', ok: true }));
          }
        }
      });

      function finish() {
        setTimeout(() => {
          assert(hostSawWorker, 'host detected worker joining');
          assert(roundTripOk, 'task_request -> task_assign -> task_result round trip completed');
          worker.destroy();
          setTimeout(() => {
            assert(true, 'worker torn down (disconnect simulated - dispatcher would re-queue this in the real app)');
            host.destroy();
            log('Test run complete.');
          }, 300);
        }, 200);
      }
    });
  </script>
</body>
</html>
