<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tabCluster - Worker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page-center">
    <div class="card worker-card">

      <div id="join-panel">
        <div class="panel-title">Join a cluster</div>
        <h2>Enter room code</h2>
        <form id="join-form">
          <input type="text" id="room-input" maxlength="10" placeholder="ABCDE" autocomplete="off" />
          <button type="submit" class="primary">Join &amp; start computing</button>
        </form>
      </div>

      <div id="work-panel" class="hidden">
        <div class="panel-title">Connected as worker</div>
        <h2 id="status">Connecting...</h2>

        <div class="work-stat">
          <span class="label">Connection</span>
          <span id="conn-mode">-</span>
        </div>
        <div class="work-stat">
          <span class="label">CPU threads available</span>
          <span id="thread-count">-</span>
        </div>
        <div class="work-stat">
          <span class="label">Chunks completed</span>
          <span id="completed-count">0</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Third-party: WebRTC signaling client -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>

  <!-- tabCluster, in dependency order -->
  <script src="js/shared/config.js"></script>
  <script src="js/shared/protocol.js"></script>
  <script src="js/network/local-bus.js"></script>
  <script src="js/network/p2pmesh.js"></script>
  <script src="js/network/transport.js"></script>
  <script src="js/network/heartbeat.js"></script>
  <script src="js/worker/workermain.js"></script>
</body>
</html>
